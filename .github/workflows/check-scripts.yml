name: Check Scripts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7 # v9 Is not a valid version, v7 is the lastes version available

      - name: Run script exercise
        shell: bash
        run: bash task-1-script/random-data.sh   # Changed count-files.sh to random-data.sh since the first doesnt exist
        working-directory: ./junior

      - name: Run configuration exercise
        shell: bash
        run: bash task-2-configuration/show-service.sh #Changed check-service.sh to show-service.sh since the first also doesnt exist
        working-directory: ./junior # Added working-directory to ensure the script runs in the right folder