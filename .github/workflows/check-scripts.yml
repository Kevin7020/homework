name: Check Scripts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7 # v9 Is not a valid version, v7 is the lastes version available

      - name: Run script exercise
        shell: bash
        run: bash task-1-script/count-files.sh
        working-directory: ./junior

      - name: Run configuration exercise
        shell: bash
        run: bash task-2-configuration/check-service.sh